[project]
name = "game-bot"
version = "0.1.0"
description = "传统识图游戏脚本框架：状态层 / 流程层 / 执行层 / 原子化方法层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mss>=9.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 平台后端：按需二选一（或都装）
windows = ["pywin32>=306", "pydirectinput>=1.0.4"]
android = ["adbutils>=2.0"]
# OCR：find_text / read_text / read_number 需要其中之一
ocr-rapid = ["rapidocr-onnxruntime>=1.3.0"]
ocr-tesseract = ["pytesseract>=0.3.10"]

[project.scripts]
gamebot = "gamebot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[build-system]
# 显式把 pathspec 钉在 2 以下：某些镜像源上存在一个坏掉的 pathspec 26.x，
# hatchling 导入它时会 ImportError（re2_error），导致 editable 安装直接失败。
requires = ["hatchling", "pathspec<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamebot"]

[tool.ruff]
line-length = 100
target-version = "py311"
# games 是业务层（具体游戏的脚本），也要检查
src = ["src", "tests", "games"]
# 显式排除，别依赖 .gitignore（没 git init 时不可靠，且 .venv 里全是噪音）
extend-exclude = [
    ".venv",
    ".uv-cache",
    "logs",
    "assets",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 本项目的注释、docstring、日志文本全部用中文，
    # 全角标点在中文语境里是正确的，不是"歧义字符"。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["gamebot", "games"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
