# 命名区域表
#
# 把坐标从代码里挪出来。脚本里写 cfg.region("hp_bar")，而不是 Region(940, 520, 40, 40)。
# 坐标一律是**源分辨率**（截出来的真实像素）；如果配了 logic_size，
# 这里的坐标应该按逻辑分辨率写 —— Session 会负责换算。
#
# 两种写法都支持：
#   name: [x, y, w, h]
#   name: {x: 0, y: 0, w: 100, h: 50}
#
# 调区域的方法：gamebot grab --region x,y,w,h -o logs/screenshots/roi.png

regions:
  # --- 全屏 ---
  full: [0, 0, 1920, 1080]

  # --- 示例：按自己的游戏改 ---
  # 顶部血条 / 体力条
  hp_bar: [100, 20, 300, 24]
  stamina_bar: [100, 50, 300, 24]

  # 数字读数区（read_number 用，区域要尽量只包含数字本身）
  stamina_text: [420, 48, 90, 24]
  level_text: [40, 12, 120, 30]

  # 右侧技能栏
  skill_panel: [1600, 600, 300, 400]

  # 弹窗整体（用于判断弹窗在不在，比找单个按钮更稳）
  dialog_panel: [560, 300, 800, 400]

  # 战斗结算区域
  result_panel: [560, 260, 800, 500]
