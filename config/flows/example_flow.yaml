# 示例脚本定义
#
# 一份定义 = 页面树（我在哪） + 流程图（做什么）。
# 两者分开是因为变化频率不同：加一个界面 vs 改一条策略。
#
# 运行：gamebot check   （先校验，能挡住模板缺失、页面 id 写错这类问题）
#      gamebot run --dry-run

name: example

# ---------- 运行参数 ----------
initial: home            # 流程图的起始节点
tick_interval: 0.3       # 每轮最小间隔；给 0 会打满 CPU 且日志没法看
max_runtime: 3600        # 总时长上限；null = 不限

on_unknown: wait         # wait | reload_tick | recovery | stop
recovery_node: home      # on_unknown=recovery 时跳到哪个节点
unknown_grace: 1.5       # 宽容期：过场动画本来就会短暂认不出来
stop_pages: [closed]     # 进入这些页面即结束
require_confirmed: true  # 页面未"确认进入"前不执行动作

# ---------- 页面树：我在哪 ----------
# id 由嵌套位置自动推导（home -> home/qianli -> home/qianli/battle）
# roi 相对父页面 —— 子页面只需要看自己那一块，这是树最大的性能收益
pages:
  home:
    name: 首页
    queries:
      - {type: ImageQuery, template: home/logo.png}
    children:
      qianli:
        name: 千里单骑
        queries:
          - {type: ImageQuery, template: qianli/entry.png}
        children:
          battle:
            name: 战斗
            roi: [1180, 620, 680, 500]   # 只看右下角技能栏
            queries:
              - {type: ImageQuery, template: battle/skillbar.png}
            children:
              result:
                name: 战斗结算
                min_stable_frames: 2     # 连续 2 帧才算，过滤动画闪现
                queries:
                  - type: OrQuery
                    short_circuit: true
                    queries:
                      - {type: ImageQuery, template: result/victory.png}
                      - {type: ImageQuery, template: result/defeat.png}

  closed:
    name: 游戏已关闭
    terminal: true
    queries:
      - {type: ImageQuery, template: common/window_lost.png, confidence: 0.95}

  # 顶层 + kind: overlay = 全局弹窗，出现在任何页面都能被认出来
  network_error:
    name: 网络错误
    kind: overlay
    priority: 100              # 同级里最先试
    queries:
      - {type: ImageQuery, template: common/network_error.png}

# ---------- 流程图：做什么 ----------
# page 声明"这个节点打算在哪个页面上执行"：
# 实际定位到的页面和它不一致时，一个动作都不会做 —— 防止在错误页面上乱点
nodes:
  home:
    page: home
    steps:
      - type: ClickImageStep
        template: qianli/entry.png
        name: 进入千里单骑
        policy:
          retry: {max_attempts: 3, interval: 0.5}
          on_error: continue

  battle:
    page: home/qianli/battle
    cooldown: 0.5              # 两次点技能之间至少隔 0.5s
    steps:
      - type: ClickImageStep
        template: battle/skill.png
        name: 点技能
        policy:
          retry: {max_attempts: 2, interval: 0.2}
          on_error: continue

  result:
    page: home/qianli/battle/result
    on_enter:
      - {type: WaitStep, seconds: 0.5, name: 等结算动画}
    steps:
      - type: ClickImageStep
        template: result/confirm.png
        name: 点确认
        policy:
          retry: {max_attempts: 5, interval: 0.5}
          on_error: raise       # 这一步点不掉，继续跑没意义

  closed:
    page: closed

# ---------- 边：何时换目标 ----------
# priority 大的先判断。没条件的边是"兜底"，别给它高优先级。
edges:
  - source: battle
    target: result
    priority: 30
    label: 战斗结束
    condition: {type: ImageQuery, template: result/victory.png}

  - source: result
    target: home
    priority: 20
    label: 结算完成回首页
    cooldown: 1.0            # 防抖：1 秒内不重复触发

  - source: home
    target: battle
    priority: 10
    label: 进入战斗

  - source: battle
    target: closed
    priority: 1
    kind: terminal
    label: 游戏关了
    condition: {type: ImageQuery, template: common/window_lost.png}
